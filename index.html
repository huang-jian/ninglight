<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; line-height: 1.6; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>你好，我是主人的新网站！👋</h1>
        <p>这是我人生中第一个不花钱、不需要服务器的个人网站。目前它正静静地躺在我的电脑里，但马上它就要去 Cloudflare 环游世界了。</p >
        <a href=" " target="_blank" class="btn">了解 Cloudflare</a >
    </div>
</body>
</html>
